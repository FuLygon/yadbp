name: Release

# Release tags look like 1.0.0 or v1.0.0. The leading "v" is optional and is
# stripped from the version reported by the binary.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          asset="yadbp_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            asset="${asset}.exe"
          fi

          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X yadbp/internal/utils.Version=${version}" \
            -o "dist/${asset}" \
            ./cmd/yadbp

          echo "Built dist/${asset}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yadbp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            yadbp_darwin_amd64
            yadbp_darwin_arm64
            yadbp_linux_amd64
            yadbp_linux_arm64
            yadbp_windows_amd64.exe
            yadbp_windows_arm64.exe
          )

          for asset in "${expected[@]}"; do
            if [[ ! -f "dist/${asset}" ]]; then
              echo "missing release asset: ${asset}" >&2
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${version}" \
            --generate-notes \
            --verify-tag
